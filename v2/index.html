html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden}
body{font-family:"HN","Helvetica Neue",Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#viewport{position:absolute;left:0;top:0;bottom:0;right:0;overflow:hidden;background:#000}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#000;transform-origin:0 0;overflow:hidden}
#px{position:absolute;left:0;bottom:0;width:1080px;display:block}
#content{position:absolute;left:0;top:0;width:1080px;padding:0 64px;box-sizing:border-box}
.logo{display:block;margin-top:64px;width:calc(380px*var(--k));height:auto}
.h1{margin-top:calc(70px*var(--k));font-size:calc(84px*var(--k));line-height:1;letter-spacing:-.5px;white-space:nowrap}
.h1 b{font-weight:700}.h1 span{font-weight:300;margin-left:.22em}
.h1sub{font-weight:400;font-size:calc(38px*var(--k));margin-top:calc(14px*var(--k))}
.rule{height:3px;background:#fff;margin-top:calc(26px*var(--k))}
.today{display:flex;justify-content:space-between;align-items:flex-end;margin-top:calc(22px*var(--k))}
.lbl{font-size:calc(25px*var(--k));line-height:1.22;text-transform:uppercase}
.lbl b{font-weight:700;display:block}.lbl i{font-style:normal;font-weight:400;display:block}
.date{font-weight:700;font-size:calc(50px*var(--k));line-height:1;text-transform:uppercase;text-align:right;white-space:nowrap}
.date small{display:block;font-weight:400;font-size:calc(22px*var(--k));margin-top:calc(8px*var(--k));text-transform:none}
.list{margin-top:calc(26px*var(--k))}
.row{display:flex;justify-content:space-between;align-items:center;padding:calc(15px*var(--k)) 0;border-top:1px solid #fff}
.row:first-child{border-top:0}
.nm{font-weight:700;font-size:calc(44px*var(--k));line-height:1.05}
.nm small{display:block;font-weight:400;font-size:calc(24px*var(--k));margin-top:calc(6px*var(--k))}
.pr{font-weight:700;font-size:calc(82px*var(--k));line-height:1;white-space:nowrap;text-align:right;letter-spacing:-1px}
.pr .u{font-weight:300;font-size:.38em;letter-spacing:0;margin-left:.2em}
.prs{display:flex}.prs .pr{min-width:calc(270px*var(--k))}
.prs .pr.off{font-weight:300}
.colh{display:flex;justify-content:flex-end;margin-top:calc(26px*var(--k))}
.colh div{min-width:calc(270px*var(--k));text-align:right;font-size:calc(22px*var(--k));text-transform:uppercase;line-height:1.2}
.colh div.on{font-weight:700}
.colh + .list{margin-top:calc(6px*var(--k))}
.grid2{display:flex;margin-top:calc(34px*var(--k))}
.grid2 .col{flex:1 1 0;min-width:0}
.grid2 .col + .col{margin-left:56px}
.ch{border-top:3px solid #fff;padding-top:calc(14px*var(--k));font-size:calc(22px*var(--k));line-height:1.2;text-transform:uppercase}
.ch b{display:block;font-weight:700;font-size:calc(27px*var(--k))}
.ch i{display:block;font-style:normal}
.ch em{display:block;font-style:normal;font-weight:300;text-transform:none;font-size:calc(21px*var(--k));margin-top:calc(2px*var(--k))}
.crow{display:flex;justify-content:space-between;align-items:baseline;margin-top:calc(10px*var(--k))}
.crow .cn{font-size:calc(26px*var(--k))}
.crow .cn small{font-weight:300;font-size:.8em;margin-left:.35em}
.crow .cp{display:inline-block;min-width:calc(84px*var(--k));text-align:right;font-weight:700;font-size:calc(40px*var(--k));white-space:nowrap}
.crow .cp .u{font-weight:300;font-size:.5em;margin-left:.15em}
.crow .cp.off{font-weight:300}
.notes{margin-top:calc(30px*var(--k));font-size:calc(21px*var(--k));line-height:1.3}
.notes p{margin:0 0 calc(10px*var(--k)) 0}
.notes p b{font-weight:400;display:block;font-size:calc(23px*var(--k))}
.notes p span{font-weight:300;display:block}
.closed{margin-top:calc(60px*var(--k));font-weight:700;font-size:calc(96px*var(--k));line-height:1.05}
.closed small{display:block;font-weight:400;font-size:calc(40px*var(--k));margin-top:calc(16px*var(--k))}
#foot{position:absolute;left:64px;bottom:58px;right:64px}
#foot .t1{font-size:34px;font-weight:400;text-shadow:0 0 0 #000}
#foot .t2{font-size:26px;font-weight:300;margin-top:4px}
#foot .tag{display:inline-block;background:#110b09;color:#fff;font-weight:700;font-size:31px;padding:13px 26px 15px;margin-top:26px}
/* ---------- editor ---------- */
#edbtn{position:fixed;right:14px;top:14px;z-index:20;background:#fff;color:#000;border:0;font:700 14px "HN",Arial,sans-serif;padding:10px 14px;cursor:pointer;letter-spacing:.5px}
#editor{position:fixed;right:0;top:0;bottom:0;width:560px;max-width:100%;background:#111;color:#eee;z-index:30;overflow-y:auto;font:400 14px/1.4 "HN",Arial,sans-serif;box-sizing:border-box;padding:18px 20px 120px;display:none;border-left:1px solid #333}
#editor.open{display:block}
#editor h2{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;margin:26px 0 8px;color:#fff;border-top:1px solid #444;padding-top:14px}
#editor h2:first-of-type{border-top:0;margin-top:6px;padding-top:0}
#editor .hd{display:flex;justify-content:space-between;align-items:center}
#editor .hd strong{font-size:16px}
#editor input,#editor select,#editor textarea{background:#000;color:#fff;border:1px solid #555;font:inherit;padding:5px 6px;box-sizing:border-box;border-radius:0;min-width:0}
#editor input:focus,#editor select:focus,#editor textarea:focus{outline:none;border-color:#da107f}
#editor input[type=checkbox]{width:auto;margin-right:6px}
#editor button{background:#222;color:#fff;border:1px solid #555;font:inherit;padding:5px 9px;cursor:pointer;border-radius:0}
#editor button:hover{border-color:#da107f}
